name: Auto-Bundle Script

on:
  push:
    branches:
      - 'main'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Bundle Archi Script
        run: |
          mkdir -p dist
          echo "// COVO Validator - Bundled Version" > "dist/COVO Validator.ajs"
          echo "// Build Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "dist/COVO Validator.ajs"
          echo "// GitHub Commit: ${{ github.sha }}" >> "dist/COVO Validator.ajs"
          echo "" >> "dist/COVO Validator.ajs"
          cat config.js utils.js constraints.js >> "dist/COVO Validator.ajs"
          sed '/load(.*);/d' main.js >> "dist/COVO Validator.ajs"
      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add "dist/COVO Validator.ajs"
          git commit -m "dist: update bundled script" || echo "No changes"
          git push
